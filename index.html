<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Soothy App</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #ffffff;
            color: #000000;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
        }

        .container {
            max-width: 400px;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 25px;
        }

        .info-box {
            background-color: #f8f8f8;
            border-radius: 20px;
            padding: 20px;
            font-size: 1.1rem;
            line-height: 1.5;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            position: relative;
            margin-bottom: 20px;
        }

        .info-box .icon {
            display: inline-block;
            vertical-align: middle;
            margin: 0 5px;
        }

        .tiktok-icon {
            height: 24px;
        }

        .dots-icon {
            width: 24px;
            height: 24px;
            background-color: #e0e0e0;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .app-icon {
            width: 120px;
            height: 120px;
            border-radius: 28px;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.15);
            overflow: hidden; /* Ensures the image respects the border-radius */
        }

        .app-icon img {
            width: 100%;
            height: 100%;
            object-fit: cover; /* Ensures the image covers the area without distortion */
        }

        h1 {
            font-size: 1.8rem;
            font-weight: 700;
            margin: 0;
        }

        .download-button {
            background-color: #007aff;
            color: white;
            border: none;
            border-radius: 50px;
            padding: 18px 40px;
            font-size: 1.2rem;
            font-weight: 500;
            cursor: pointer;
            width: 100%;
            max-width: 300px;
            transition: background-color 0.3s ease;
            box-shadow: 0 4px 12px rgba(0, 122, 255, 0.3);
            text-decoration: none;
            display: inline-block;
            box-sizing: border-box;
        }

        .download-button:hover {
            background-color: #005ecb;
        }

    </style>
</head>
<body>

    <div class="container">
        <!-- Flèches SVG tout en haut à droite de la page -->
        <div id="tiktok-arrows" style="position:fixed; top:18px; right:22px; z-index:1000; pointer-events:none;">
            <svg width="38" height="80" viewBox="0 0 38 80" fill="none" xmlns="http://www.w3.org/2000/svg" style="display:block;">
              <polyline points="6,20 19,7 32,20" stroke="#222" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
              <polyline points="6,40 19,27 32,40" stroke="#222" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
              <polyline points="6,60 19,47 32,60" stroke="#222" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
        </div>
        <div id="tiktok-message" style="background:none;box-shadow:none;border:none;display:none;padding-top:90px;padding-bottom:18px;">
            <div style="font-size:1.45rem;font-weight:700;margin-bottom:22px;text-align:center;">To access the link,<br>follow these two simple steps:</div>
            <div style="display:flex;align-items:center;gap:14px;margin-bottom:16px;">
                <div style="font-weight:500;font-size:1.25rem;border:2px solid #bbb;border-radius:50%;width:42px;height:42px;display:flex;align-items:center;justify-content:center;">1</div>
                <div style="text-align:left;font-size:1.18rem;line-height:1.45;font-weight:400;">
                    Tap <span class="icon dots-icon" style="vertical-align:middle;"><svg width="26" height="26" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg"><circle cx="4" cy="8" r="1.7" fill="#8e8e93"/><circle cx="8" cy="8" r="1.7" fill="#8e8e93"/><circle cx="12" cy="8" r="1.7" fill="#8e8e93"/></svg></span> at the top right
                </div>
            </div>
            <div style="display:flex;align-items:center;gap:14px;">
                <div style="font-weight:500;font-size:1.25rem;border:2px solid #bbb;border-radius:50%;width:42px;height:42px;display:flex;align-items:center;justify-content:center;">2</div>
                <div style="text-align:left;font-size:1.18rem;line-height:1.45;font-weight:400;">
                    Then tap <span style="color:#24b47e;font-weight:700;">"Open in browser"</span>
                </div>
            </div>
        </div>

        <div id="android-message" class="info-box" style="display:none;">
            The Soothy app is not available on Android yet.<br>Stay tuned, it's coming soon!
        </div>

        <div id="main-content" style="display:flex;flex-direction:column;align-items:center;justify-content:center;">
            <div class="app-icon" style="margin:0 auto 32px auto;">
                <img src="soothy-icon.png" alt="Soothy App Icon">
            </div>
            <h1 style="font-size:2.2rem;font-weight:700;margin:0 0 32px 0;line-height:1.13;text-align:center;">Search "Soothy" on the <br>App Store</h1>
            <a href="https://apps.apple.com/us/app/soothy-baby-sleep-sounds/id6482288881" class="download-button" style="margin-top:0;">Download App</a>
        </div>
    </div>

<script>
(function() {
    var ua = navigator.userAgent;
    var uaLower = ua.toLowerCase();
    var isAndroid = uaLower.includes('android');
    var isIOS = /iphone|ipad|ipod/.test(uaLower);
    var appStoreUrl = 'https://apps.apple.com/us/app/soothy-baby-sleep-sounds/id6482288881';

    // Règles de détection webview inspirées du code fourni
    var webviewRules = [
      'WebView',
      '(iPhone|iPod|iPad)(?!.*Safari)',
      'Android.*(;\\s+wv|Version/\\d.\\d\\s+Chrome/\\d+(\\.0){3})',
      'Linux; U; Android'
    ];
    var webviewRegExp = new RegExp('(' + webviewRules.join('|') + ')', 'i');
    function isWebview(ua) {
      return !!ua.match(webviewRegExp);
    }

    var tiktokMsg = document.getElementById('tiktok-message');
    var androidMsg = document.getElementById('android-message');
    var mainContent = document.getElementById('main-content');

    if (isAndroid) {
      tiktokMsg.style.display = 'none';
      androidMsg.style.display = 'block';
      mainContent.style.display = 'none';
    } else if (isWebview(ua)) {
      // Si c'est une webview TikTok, on affiche le message TikTok
      if (uaLower.includes('bytedancewebview') || uaLower.includes('musical_ly')) {
        tiktokMsg.style.display = 'block';
        androidMsg.style.display = 'none';
        mainContent.style.display = 'none';
      } else {
        // Autre webview (iOS hors TikTok) : redirection App Store
        window.location.href = appStoreUrl;
      }
    } else {
      // iOS (hors webview) : redirection
      window.location.href = appStoreUrl;
    }

})();
</script>
</body>
</html>
